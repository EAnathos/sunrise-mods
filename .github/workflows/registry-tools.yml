name: registry-tools

# Builds the v2 registry tool from a commit of main whenever its source changes, and publishes it
# as the release `registry-tool-<digest of that source>`. Every workflow gets the tool through
# .github/actions/registry-tool, which looks for the release of the source it checked out.
on:
  push:
    branches: [main]
    paths:
      - 'bot/Cargo.toml'
      - 'bot/Cargo.lock'
      - 'bot/src/**'
      - '.github/workflows/registry-tools.yml'
  workflow_dispatch:

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # A tag names one source's build: an existing one is never replaced.
      - name: Stop if this source's tool is released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same digest .github/actions/registry-tool computes from its checkout.
          source=$(git ls-tree HEAD -- bot/Cargo.toml bot/Cargo.lock bot/src | sha256sum | cut -d' ' -f1)
          echo "source=$source" >> "$GITHUB_OUTPUT"
          if gh release view "registry-tool-$source" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "registry-tool-$source is already released." >> "$GITHUB_STEP_SUMMARY"
            echo 'released=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build the v2 registry tool
        if: steps.existing.outputs.released != 'true'
        run: cargo build --locked --manifest-path bot/Cargo.toml --target-dir target --release
      - name: Stage the binary and its pin
        if: steps.existing.outputs.released != 'true'
        env:
          SOURCE: ${{ steps.existing.outputs.source }}
        run: |
          set -euo pipefail
          mkdir dist
          cp target/release/registry-bot dist/registry-bot
          echo "$SOURCE  $(sha256sum < dist/registry-bot | cut -d' ' -f1)" > dist/PIN
          echo "Built from $GITHUB_SHA by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." > notes.md
      # The pin joins the source digest to the binary's SHA-256, and its attestation says this
      # workflow wrote it on main.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.existing.outputs.released != 'true'
        with:
          subject-path: dist/PIN
      - name: Publish the release
        if: steps.existing.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.existing.outputs.source }}
        run: |
          gh release create "registry-tool-$SOURCE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --latest=false --title "Registry tool ${SOURCE:0:12}" --notes-file notes.md \
            dist/registry-bot dist/PIN
