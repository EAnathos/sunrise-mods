name: registry-tools

# Builds the v2 registry tool that publish.yml runs, from a commit of main, and publishes it as
# the release `registry-tools-<commit>`. publish.yml runs it only by that tag, the binary's sha256
# and the digest of its source, all three written in publish.yml: moving it to a newer build is a
# pull request that changes them.
on:
  push:
    branches: [main]
    paths:
      - 'bot/Cargo.toml'
      - 'bot/Cargo.lock'
      - 'bot/src/**'
  workflow_dispatch:

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # A tag names one commit's build: an existing one is never replaced.
      - name: Stop if this commit's tool is released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "registry-tools-$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "registry-tools-$GITHUB_SHA is already released." >> "$GITHUB_STEP_SUMMARY"
            echo 'released=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build the v2 registry tool
        if: steps.existing.outputs.released != 'true'
        run: cargo build --locked --manifest-path bot/Cargo.toml --target-dir target --release
      - name: Stage the binary and its pins
        id: stage
        if: steps.existing.outputs.released != 'true'
        run: |
          set -euo pipefail
          mkdir dist
          cp target/release/registry-bot dist/registry-bot
          (cd dist && sha256sum registry-bot > SHA256SUMS)
          # The same digest publish.yml computes to tell whether main's tool source is this one.
          source=$(git ls-tree HEAD -- bot/Cargo.toml bot/Cargo.lock bot/src | sha256sum | cut -d' ' -f1)
          binary=$(cut -d' ' -f1 dist/SHA256SUMS)
          {
            echo "Built from $GITHUB_SHA by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
            echo
            echo 'For `publish.yml`:'
            echo
            echo '```yaml'
            echo "REGISTRY_TOOL_TAG: registry-tools-$GITHUB_SHA"
            echo "REGISTRY_TOOL_SHA256: $binary"
            echo "REGISTRY_TOOL_SOURCE: $source"
            echo '```'
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.existing.outputs.released != 'true'
        with:
          subject-path: dist/registry-bot
      - name: Publish the release
        if: steps.existing.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "registry-tools-$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --latest=false --title "Registry tools ${GITHUB_SHA:0:12}" --notes-file notes.md \
            dist/registry-bot dist/SHA256SUMS
