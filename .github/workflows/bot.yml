name: registry-v2

on:
  pull_request:
    paths:
      - 'bot/**'
      - 'registry/**'
      - '.github/registry-v2/**'
      - '.github/workflows/bot.yml'
      - '.github/actions/registry-tool/**'
      - '.github/workflows/publish.yml'
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - 'registry/**'
      - '.github/registry-v2/**'
      - '.github/workflows/bot.yml'
      - '.github/actions/registry-tool/**'
      - '.github/workflows/publish.yml'

permissions:
  contents: read
  attestations: read

jobs:
  bot:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The commit and its first parent: the pull request's base, or main before the push.
          fetch-depth: 2
          persist-credentials: false
      - name: Test the release PR scripts
        run: python3 -I -m unittest discover -s ci -p 'test_release*.py'
      # The tool's own checks run only on a change to the tool or its tests.
      - id: bot
        run: git diff --quiet HEAD^1 HEAD -- . || echo 'changed=true' >> "$GITHUB_OUTPUT"
      - if: steps.bot.outputs.changed == 'true'
        run: cargo fmt --check
      - if: steps.bot.outputs.changed == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - if: steps.bot.outputs.changed == 'true'
        run: cargo test --locked
      # The released tool when this checkout's tool source is main's, a build of it otherwise.
      - uses: ./.github/actions/registry-tool
      - name: Check the v2 registry
        working-directory: .
        run: target/release/registry-bot check .
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: A listed project keeps a release
        if: github.event_name == 'pull_request'
        working-directory: .
        run: target/release/registry-bot stay-listed base .
      - name: Only the owner of its mods changes a collection
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: target/release/registry-bot collection-author base . "$AUTHOR"
      - uses: ./.github/actions/registry-tool
        with:
          name: registry-verifier
      - name: Exercise signed Pages publication and recovery fixtures
        working-directory: .
        env:
          REGISTRY_BOT: ${{ github.workspace }}/target/release/registry-bot
          REGISTRY_VERIFIER: ${{ runner.temp }}/index-verifier/release/registry-bot
        run: |
          python3 -B .github/registry-v2/test_publish.py
          python3 -B .github/registry-v2/test_fit_store.py
      - name: Dry watch of an empty registry (no network)
        working-directory: .
        run: |
          empty="$RUNNER_TEMP/empty-registry"
          mkdir -p "$empty/registry/projects"
          cp registry/{categories,release-workflow}.toml "$empty/registry/"
          mkdir "$empty/registry/repositories"
          printf 'revoked = []\n' > "$empty/registry/revoked.toml"
          target/release/registry-bot watch "$empty" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/dry-watch"
          grep -Fx 'No repositories are registered.' "$RUNNER_TEMP/dry-watch/watch.md"
