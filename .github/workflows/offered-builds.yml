name: refresh offered game builds

# Started every ten minutes by timer.yml.
on:
  workflow_dispatch:

permissions: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.compare.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compare offered builds with the verified catalogue
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f registry/index-key.pub ]]; then
            echo 'Registry v2 is not live until its public key is configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cargo build --locked --manifest-path bot/Cargo.toml --target-dir target --release
          target/release/registry-bot builds --out offered-builds.json
          python3 -I .github/registry-v2/live.py --bot target/release/registry-bot --out v2-previous
          if [[ ! -f v2-previous/index.json ]]; then
            publish=true
          else
            publish=$(target/release/registry-bot new-builds offered-builds.json v2-previous/index.json --key registry/index-key.pub)
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: detect
    if: github.ref == 'refs/heads/main' && needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Refresh the registry on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo sunrise-org/sunrise-mods --ref main
