name: judge fits

# The one writer of fit verdicts. Every push to main is judged here and then published. A dispatch
# also looks for new game builds to offer, and publishes only when that changed what is stored:
# timer.yml dispatches this whenever Sunrise has a release the stored list does not name.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: registry-fit
  cancel-in-progress: false

jobs:
  judge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/registry-tool
      - name: Judge the releases that have no current verdict
        id: judge
        run: |
          set -euo pipefail
          bot=target/release/registry-bot
          python3 -I .github/registry-v2/fit_store.py read --optional
          considered=()
          # A push changes releases, not game builds: it is judged on the builds already offered.
          if [[ "$GITHUB_EVENT_NAME" != push || ! -f registry/fit/builds.json ]]; then
            "$bot" builds --out "$RUNNER_TEMP/considered.json"
            considered=(--builds "$RUNNER_TEMP/considered.json")
          fi
          "$bot" fit . "${considered[@]}"
          python3 -I .github/registry-v2/fit_store.py write "Judge fits for $GITHUB_SHA"
      # A newer push has its own run of this job, which publishes it once it is judged. A push
      # can change what the index says without changing a verdict (a project's details, a pause,
      # a takedown, a collection), so it always publishes.
      - name: Publish main
        if: github.event_name == 'push' || steps.judge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "Main moved to $head; its own run publishes it." >> "$GITHUB_STEP_SUMMARY"
          fi
