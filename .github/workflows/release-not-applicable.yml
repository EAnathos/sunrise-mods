name: Mark non-release PRs

# No checkout, no PR code or expressions in scripts: only GitHub's PR metadata and paths are read.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  # GitHub starts no pull_request workflow for a PR opened with GITHUB_TOKEN, so the watcher
  # asks for its maintenance PRs by number. The same path check decides; the branch name does not.
  workflow_dispatch:
    inputs:
      pr:
        description: Number of an open pull request to main
        type: string
        required: true

permissions: {}

jobs:
  not-a-release:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Record not applicable on the exact head only when no release files changed
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_PR: ${{ inputs.pr }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          def api(path, *args):
              result = subprocess.check_output(["gh", "api", "--hostname", "github.com", *args,
                                                f"repos/{os.environ['GITHUB_REPOSITORY']}/{path}"])
              return json.loads(result)

          def tree(sha):
              data = api(f"git/trees/{sha}")
              if data["truncated"]:
                  raise SystemExit("GitHub truncated the release path inventory.")
              return {entry["path"]: entry for entry in data["tree"]}

          def subtree(entries, name):
              entry = entries.get(name)
              return entry["sha"] if entry and entry["type"] == "tree" else None

          def projects_tree(commit):
              root = api(f"git/commits/{commit}")["tree"]["sha"]
              registry = subtree(tree(root), "registry")
              return subtree(tree(registry), "projects") if registry else None

          def project_paths(project):
              if project is None or project["type"] != "tree":
                  return {}
              return {name: (entry["mode"], entry["sha"]) for name, entry in tree(project["sha"]).items()
                      if name in ("releases", "page")}

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_bytes())
          if "pull_request" in event:
              number, head = event["number"], event["pull_request"]["head"]["sha"]
          else:
              number = os.environ["DISPATCHED_PR"]
              if not re.fullmatch(r"[1-9][0-9]{0,9}", number):
                  raise SystemExit("Invalid PR number.")
              head = api(f"pulls/{number}")["head"]["sha"]
          if not re.fullmatch(r"[0-9a-f]{40}", head):
              raise SystemExit("Invalid PR head SHA.")
          endpoint = f"pulls/{number}"
          before = api(endpoint)
          if before["state"] != "open" or before["base"]["ref"] != "main" or before["head"]["sha"] != head:
              raise SystemExit(0)
          # An own release branch is never marked green here, even if malformed or if the
          # only changed file were the new project.toml. Its check always comes from main.
          head_repo = before["head"]["repo"]
          if before["user"]["login"] == "github-actions[bot]" and before["head"]["ref"].startswith("release/") \
             and head_repo and head_repo["full_name"].lower() == os.environ["GITHUB_REPOSITORY"].lower():
              raise SystemExit(0)
          base = before["base"]["sha"]
          # Pin the comparison to immutable commits: the live PR files listing can change on a force-push.
          comparison = api(f"compare/{base}...{head}?per_page=1")
          files = comparison["files"]
          release_path = re.compile(r"registry/projects/[^/]+/(?:releases|page)(?:/|$)")
          is_release = any(release_path.match(file.get(key, "")) for file in files
                           for key in ("filename", "previous_filename"))
          # GitHub's compare endpoint caps its file list at 300. When it might be incomplete,
          # compare the mode and tree IDs of just the protected subtrees. Never fetch blobs.
          if not is_release and (len(files) >= 300 or len(files) != before["changed_files"]):
              old = projects_tree(comparison["merge_base_commit"]["sha"])
              new = projects_tree(head)
              if old != new:
                  old_projects = tree(old) if old else {}
                  new_projects = tree(new) if new else {}
                  is_release = any(project_paths(old_projects.get(project)) != project_paths(new_projects.get(project))
                                   for project in old_projects.keys() | new_projects.keys()
                                   if old_projects.get(project) != new_projects.get(project))
          after = api(endpoint)
          if not is_release and after["state"] == "open" and after["base"]["ref"] == "main" \
             and after["base"]["sha"] == base and after["head"]["sha"] == head:
              api(f"statuses/{head}", "-X", "POST", "-f", "context=registry-v2/release-check",
                  "-f", "state=success", "-f", "description=not a release")
          PY
