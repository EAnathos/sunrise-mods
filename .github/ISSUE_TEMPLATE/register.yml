name: Register a repository
description: Ask for your mod's repository to be added to the registry, so its releases are picked up
title: "Register <owner>/<repository>"
body:
  - type: markdown
    attributes:
      value: |
        The registry checks your repository from this issue and opens its registration pull request, as the form at https://playsunrise.net/mods/submit does; the answer is a comment here. Registering lists nothing by itself: a project appears in Discover after its first release through `cargo sunrise-mod release` is reviewed and merged.

        An issue can register only a public repository that belongs to the personal account opening it. For an organisation's repository, an admin of it uses the form at https://playsunrise.net/mods/submit instead.

        Before opening it, run `cargo sunrise-mod release setup` and commit what it adds: the default branch needs each mod's `sunrise-mod.toml`, `page.toml` and release workflow.
  - type: input
    id: repository
    attributes:
      label: Repository
      description: The link to your public GitHub repository
      placeholder: https://github.com/<owner>/<repository>
    validations:
      required: true
  - type: textarea
    id: packages
    attributes:
      label: Package folders
      description: Only when the repository holds several mods. One folder per line, each holding a `sunrise-mod.toml`. Leave empty when the mod is at the repository's root.
