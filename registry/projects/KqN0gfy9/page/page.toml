name = "Fireflies"
summary = "Fireflies that light up warm nights; kept in a glass jar, they make a soft lantern."
description = """
> **Beta.** Played and tested in single player; multiplayer and balance come later. Reports are welcome on the [issues](https://github.com/EAnathos/sunrise-creatures/issues).

A mod of the [Sunrise Creatures](https://github.com/EAnathos/sunrise-creatures/blob/fireflies/v0.1.3/README.md) series: fireflies that light up the night. **Requires** [Sunrise
Creatures](https://playsunrise.net/mods/creature), the series' library.

## Finding them

At night, near swamps, rivers, plains, meadows and forests, fireflies drift low and slowly in small groups, their
lanterns pulsing yellow-green. By day they rest on the ground. In creative: the spawn egg (creative tab "Sunrise
Creatures").

## Jars

Catch one with a **glass jar** (right-click it). Release it on a flower and it stays there, lighting up your garden at
night; or place the filled jar (sneak + right-click) as a small glowing lantern.
"""
