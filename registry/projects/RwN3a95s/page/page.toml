name = "Storm Spirits"
summary = "Spirits of living lightning born in thunderstorms: they shock whoever hits them, and their sparks call lightning where you aim."
description = """
> **Beta.** Played and tested in single player; multiplayer and balance come later. Reports are welcome on the [issues](https://github.com/EAnathos/sunrise-creatures/issues).

A mod of the [Sunrise Creatures](https://github.com/EAnathos/sunrise-creatures/blob/storm_spirits/v0.2.1/README.md) series: spirits of living lightning, born in storms. **Requires**
[Sunrise Creatures](https://playsunrise.net/mods/creature), the series' library.

## Finding them

In a thunderstorm, now and then a spirit appears where lightning strikes, in any biome, with a crackle of sparks. It
floats 1 to 4 blocks above the ground or the water, glowing blue, in short jerky dashes. When the storm ends it fades
within a few minutes. Only weather lightning gives birth to one: not a trident's, nor a command's. In creative: the
spawn egg (creative tab "Sunrise Creatures").

## Shocks

A spirit leaves you alone, but hit it and it dashes at you and zaps you (6 damage and a moment of Slowness), then
keeps away and comes back to zap you again every few seconds, until it loses you. Meanwhile it calls lightning down on
you every few seconds: when sparks crackle over your head, move. Anything that touches it gets a zap. It has 60
health, and lightning and fire don't hurt it.

## Sparks

A spirit drops 1 to 3 **sparks** (more with Looting). Right-click a spark to call a lightning bolt down on the block
you aim at, up to 32 blocks away, in any weather and any dimension: the spark is used up, with 2 seconds before the
next.
"""
authors = ["EAnathos"]
license = "PolyForm-Noncommercial-1.0.0 AND LicenseRef-SunriseCreatures-Art"
homepage = "https://github.com/EAnathos/sunrise-creatures/blob/main/mods/storm_spirits/README.md"
