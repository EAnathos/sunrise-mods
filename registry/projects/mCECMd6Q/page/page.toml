name = "Sunrise Zoom"
summary = "Replace spyglass zoom or add an optional animated zoom key."
description = "Sunrise Zoom lets you choose between replacing the vanilla spyglass magnification and adding a separate, rebindable hold-to-zoom key. Both modes have configurable magnification and smooth transitions. It is client-side only and needs no server installation."
authors = ["EAnathos"]
license = "PolyForm-Noncommercial-1.0.0"
icon = "icon.png"
categories = ["utility"]

