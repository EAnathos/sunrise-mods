name = "Sunrise Creatures"
summary = "The library of the Sunrise Creatures mods: the creature guide and its bestiary, the glass jar, the series' creative tab. Needed by every mod of the series."
description = """
> **Beta.** Played and tested in single player; multiplayer and balance come later. Reports are welcome on the [issues](https://github.com/EAnathos/sunrise-creatures/issues).

The library every mod of the [Sunrise Creatures](https://github.com/EAnathos/sunrise-creatures/blob/creature/v0.3.5/README.md) series needs. It adds no creature of its own, but what
the creatures share:

- **The creature guide**, given to every player the first time they join a world. Right-click it to open the
  **bestiary**: each creature you come across gets a page, turning in 3D, with the biomes you met it in, how rare it is
  and what you found out about it. A lost one is crafted again from a book, a feather and leather. Operators can fill
  it to look through it: `/bestiary unlock <species>` (or `all`) writes down everything about a species, and
  `/bestiary reset` empties it.
- **The glass jar** (3 glass in a U and an oak slab, makes 2), with Butterflies, Worms, Fireflies, Fairies, Scorpions, Ladybugs, Phasmids or Dung Beetles installed: it
  catches their creatures and releases them where you want them to stay. Sneak + right-click places a filled jar on
  display.
- **The "Sunrise Creatures" creative tab**, with every item of the series.
- **Feathers**: with the Vulture or the Seagulls installed, their feathers make arrows, a brush and a book and quill
  as a feather does.
- Monsters leave the series' creatures alone.

For developers: [SPECS.md](https://github.com/EAnathos/sunrise-creatures/blob/creature/v0.3.5/common/SPECS.md) and [CONTRIBUTING.md](https://github.com/EAnathos/sunrise-creatures/blob/creature/v0.3.5/CONTRIBUTING.md).
"""
