[package]
name = "registry-bot"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
caseless = "0.2"
minisign-verify = "0.3"
percent-encoding = "2.3"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sunrise-mod-package = { git = "https://github.com/sunrise-org/sunrise.git", rev = "592896d9c97d4f18291bfef8074d1b04e80dd311", default-features = false, features = ["index", "prebuilt"] }
sunrise-mod-surface = { git = "https://github.com/sunrise-org/sunrise.git", rev = "592896d9c97d4f18291bfef8074d1b04e80dd311" }
sunrise-native-build = { git = "https://github.com/sunrise-org/sunrise.git", rev = "592896d9c97d4f18291bfef8074d1b04e80dd311" }
sunrise-release-sign = { git = "https://github.com/sunrise-org/sunrise.git", rev = "592896d9c97d4f18291bfef8074d1b04e80dd311" }
tar = { version = "0.4", default-features = false }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
toml = "1"
unicode-normalization = "0.1"
url = "2"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
