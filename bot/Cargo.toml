[package]
name = "registry-bot"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
caseless = "0.2"
minisign-verify = "0.3"
percent-encoding = "2.3"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sunrise-dependency-rule = { git = "https://github.com/sunrise-org/sunrise.git", rev = "13ac93b2768719f1667e4362d09d4485a2ca1f0f" }
sunrise-mod-package = { git = "https://github.com/sunrise-org/sunrise.git", rev = "e4261df663dc1675322d724f07e1c3b8959a1b2b", default-features = false, features = ["index", "prebuilt"] }
sunrise-mod-surface = { git = "https://github.com/sunrise-org/sunrise.git", rev = "e4261df663dc1675322d724f07e1c3b8959a1b2b" }
sunrise-native-build = { git = "https://github.com/sunrise-org/sunrise.git", rev = "e4261df663dc1675322d724f07e1c3b8959a1b2b" }
sunrise-release-sign = { git = "https://github.com/sunrise-org/sunrise.git", rev = "e4261df663dc1675322d724f07e1c3b8959a1b2b" }
tar = { version = "0.4", default-features = false }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
toml = "1"
unicode-normalization = "0.1"
url = "2"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
